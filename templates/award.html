<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Award - {{ name }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="{% url 'main:show_main' %}" class="brand">{{ name }}</a>
            <nav>
                <a href="{% url 'main:show_main' %}">Profile</a>
                <a href="{% url 'main:show_experience' %}">Experience</a>
                <a href="{% url 'main:show_project' %}">Project</a>
                <a href="{% url 'main:show_award' %}">Award</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="experience-section" id="award">
            <div class="container">
                <p class="section-kicker">Penghargaan dan Prestasi</p>
                <h1>Award</h1>

                <div class="experience-grid">
                    {% for award in award_list %}
                    <article class="experience-card">
                        <span class="experience-category">
                            {{ award.year }}
                        </span>
                        <h2>{{ award.title }}</h2>
                        <p class="experience-description">
                            {{ award.issuer }}
                        </p>
                    </article>
                    {% empty %}
                    <p class="empty-state">
                        Belum ada penghargaan yang ditambahkan.
                    </p>
                    {% endfor %}
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
</body>
</html>
